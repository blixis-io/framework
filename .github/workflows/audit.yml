name: Audit

# Known vulnerabilities in what ships. A separate workflow, and not a step of CI, on purpose: a new advisory
# against a package this change doesn't touch must not block an unrelated pull request. It runs when the
# dependency set changes, and weekly, since advisories are published against versions already in the lockfile.
on:
  push:
    branches: [main]
    paths: [pnpm-lock.yaml, pnpm-workspace.yaml, "**/package.json"]
  pull_request:
    branches: [main]
    paths: [pnpm-lock.yaml, pnpm-workspace.yaml, "**/package.json"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Reads pnpm-lock.yaml; nothing needs installing. Production dependencies only: that is what users receive.
      - run: pnpm audit --prod --audit-level high
