name: Fresh install

# What a stranger's first hour looks like, against what this repository would publish: pack every package, scaffold
# an app with create-blixis, install the tarballs with a real package manager, build, start, call, stop. Inside the
# monorepo a source alias hides a wrong `exports` entry, a missing file or a peer range nothing satisfies; here none
# of that is hidden. Weekly as well, because Node, TypeScript and the package managers move without us.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    name: fresh install (${{ matrix.os }}, ${{ matrix.pm }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pm: [pnpm, npm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: node scripts/fresh-install.mjs --pm ${{ matrix.pm }}

  package-exports:
    name: package exports and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: node scripts/check-exports.mjs

  # An app written against the last release, on what this branch would publish next: examples/saas-api as it was at the
  # last "Version Packages" commit, built and tested against packages packed from this checkout. A deliberate breaking
  # change fails here until the next release moves the baseline, which is the signal, not a bug: it is not a required check.
  upgrade-path:
    name: upgrade path (saas-api at the last release)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blixis
          POSTGRES_PASSWORD: blixis
          POSTGRES_DB: blixis
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U blixis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - run: node scripts/upgrade-path.mjs

  # What is published on npm right now, with the published create-blixis: no tarballs, no checkout code. Only on the
  # weekly schedule and by hand, because a pull request does not change what is already published.
  published:
    name: published packages (${{ matrix.os }}, ${{ matrix.pm }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pm: [pnpm, npm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: node scripts/fresh-install.mjs --source registry --pm ${{ matrix.pm }}
