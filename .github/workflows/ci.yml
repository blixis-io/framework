name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release job starts this on the "Version Packages" branch: a pull request opened by the workflow token
  # doesn't trigger pull_request runs, so without this it would have no checks and couldn't be merged.
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # @blixis-io/db and @blixis-io/tenancy test against a real Postgres,
      # not mocks (this repo's own convention) — same image/credentials/port
      # as the local docker-compose.yml at repo root, since
      # packages/{db,tenancy}/src/*.test.ts hardcode this exact connection
      # string.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blixis
          POSTGRES_PASSWORD: blixis
          POSTGRES_DB: blixis
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U blixis"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `ci` builds first (some tests run the built binaries), then runs the tests once, with coverage: the 90% line and
      # branch thresholds in vitest.config.ts are a gate, and this produces coverage/lcov.info for the upload below.
      - run: pnpm run ci
        env:
          # The EditorConfig wrapper downloads its binary through the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          # Don't fail the build because Codecov was unreachable or the token isn't set yet.
          fail_ci_if_error: false

  # Not a required check (branch protection requires the `ci` job above, on the
  # minimum supported Node). This one exists so a newer Node breaking something
  # shows up here first, and so the compatibility page has CI evidence for it.
  compat:
    name: compat (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "latest"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blixis
          POSTGRES_PASSWORD: blixis
          POSTGRES_DB: blixis
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U blixis"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: node --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci
        env:
          # The EditorConfig wrapper downloads its binary through the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
