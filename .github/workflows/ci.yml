name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # @blixis-io/db and @blixis-io/tenancy test against a real Postgres,
      # not mocks (this repo's own convention) — same image/credentials/port
      # as the local docker-compose.yml at repo root, since
      # packages/{db,tenancy}/src/*.test.ts hardcode this exact connection
      # string.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blixis
          POSTGRES_PASSWORD: blixis
          POSTGRES_DB: blixis
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U blixis"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci
        env:
          # The EditorConfig wrapper downloads its binary through the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After `pnpm run ci` on purpose: some tests run the built binaries, which that step builds.
      # This also makes the 90% line/branch thresholds in vitest.config.ts a CI gate.
      - run: pnpm run test:coverage

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          # Don't fail the build because Codecov was unreachable or the token isn't set yet.
          fail_ci_if_error: false

  # Not a required check (branch protection requires the `ci` job above, on the
  # minimum supported Node). This one exists so a newer Node breaking something
  # shows up here first, and so the compatibility page has CI evidence for it.
  compat:
    name: compat (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "latest"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blixis
          POSTGRES_PASSWORD: blixis
          POSTGRES_DB: blixis
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U blixis"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: node --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci
        env:
          # The EditorConfig wrapper downloads its binary through the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
