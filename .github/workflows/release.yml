name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      # Same requirement as ci.yml, for the same reason: @blixis-io/db and
      # @blixis-io/tenancy test against a real Postgres, and this job also
      # runs the full pnpm run ci pipeline before publishing.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blixis
          POSTGRES_PASSWORD: blixis
          POSTGRES_DB: blixis
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U blixis"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write # to start CI on the Version Packages branch, below
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci
        env:
          # The EditorConfig wrapper downloads its binary through the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Each package's first publish still needs NPM_TOKEN (npm Trusted
      # Publishing/OIDC requires the package to already exist before it
      # can be configured on npmjs.com). Move each package to Trusted
      # Publishing right after its first successful publish, then this
      # token requirement — and the NPM_TOKEN secret itself, once every
      # package has switched — can go away. id-token: write above is
      # already granted so OIDC works the moment a package is switched.
      #
      # Both env vars below point at the same secret, for two different
      # readers: changesets/action itself checks specifically for a var
      # named NPM_TOKEN to decide whether to use token auth or fall back
      # to OIDC (confirmed by its own log: with only NODE_AUTH_TOKEN set,
      # it logged "No NPM_TOKEN found... using npm trusted publishing"
      # and silently published nothing, since OIDC wasn't configured for
      # a package that doesn't exist yet). NODE_AUTH_TOKEN is what
      # npm/pnpm's own .npmrc-based auth (wired up by setup-node's
      # registry-url above) actually reads to authenticate the publish
      # request itself.
      - id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The "Version Packages" pull request is opened with the workflow token, and GitHub doesn't start
      # `pull_request` workflows for events caused by that token, so the PR would sit with no checks and could not
      # be merged. A `workflow_dispatch` run is the exception to that rule; its checks attach to the branch's commit,
      # which is what the pull request shows. This replaces pushing an empty commit by hand after every release.
      - name: Run CI on the Version Packages branch
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
