name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      # Same requirement as ci.yml, for the same reason: @blixis-io/db and
      # @blixis-io/tenancy test against a real Postgres, and this job also
      # runs the full pnpm run ci pipeline before publishing.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blixis
          POSTGRES_PASSWORD: blixis
          POSTGRES_DB: blixis
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U blixis"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci

      # Each package's first publish still needs NODE_AUTH_TOKEN (npm
      # Trusted Publishing/OIDC requires the package to already exist
      # before it can be configured on npmjs.com). Move each package to
      # Trusted Publishing right after its first successful publish, then
      # this token requirement — and the NPM_TOKEN secret itself, once
      # every package has switched — can go away. id-token: write above is
      # already granted so OIDC works the moment a package is switched.
      - uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
