name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci

      # Each package's first publish still needs NODE_AUTH_TOKEN (npm
      # Trusted Publishing/OIDC requires the package to already exist
      # before it can be configured on npmjs.com). Move each package to
      # Trusted Publishing right after its first successful publish, then
      # this token requirement — and the NPM_TOKEN secret itself, once
      # every package has switched — can go away. id-token: write above is
      # already granted so OIDC works the moment a package is switched.
      - uses: changesets/action@v1
        with:
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
