name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      # Same requirement as ci.yml, for the same reason: @blixis-io/db and
      # @blixis-io/tenancy test against a real Postgres, and this job also
      # runs the full pnpm run ci pipeline before publishing.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: blixis
          POSTGRES_PASSWORD: blixis
          POSTGRES_DB: blixis
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U blixis"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write # to start CI on the Version Packages branch, below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci
        env:
          # The EditorConfig wrapper downloads its binary through the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing uses npm trusted publishing (OIDC): every package has `release.yml` configured as its trusted publisher
      # on npmjs.com (`npm trust list <package>`), `id-token: write` above lets the job prove who it is, and there is no
      # npm token anywhere, in this repository or in its secrets. A package that is new to npm needs a one-time `0.0.0`
      # placeholder published by hand and `npm trust github <package> --repo blixis-io/framework --file release.yml
      # --allow-publish`, because trust can only be configured for a package that exists.
      #
      # NODE_AUTH_TOKEN is empty on purpose. `setup-node` with `registry-url` writes an .npmrc that reads it, and when it
      # is not set at all `setup-node` fills it with a placeholder; an empty value leaves npm to use OIDC. (The release
      # of 2026-10-07 published `@blixis-io/security` and `@blixis-io/health` this way.)
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v1
        with:
          publish-script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ""

      # The "Version Packages" pull request is opened with the workflow token, and GitHub doesn't start
      # `pull_request` workflows for events caused by that token, so the PR would sit with no checks and could not
      # be merged. A `workflow_dispatch` run is the exception to that rule; its checks attach to the branch's commit,
      # which is what the pull request shows. This replaces pushing an empty commit by hand after every release.
      - name: Run CI on the Version Packages branch
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
