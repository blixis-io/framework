# https://docs.codecov.com/docs/codecov-yaml
coverage:
  status:
    project:
      default:
        # Fail the status if overall coverage drops by more than a point.
        target: auto
        threshold: 1%
    patch:
      default:
        # New and changed lines should be covered about as well as the rest.
        target: auto
        threshold: 5%

# Coverage is only measured for packages/*/src (see vitest.config.ts); keep everything else out of the report.
ignore:
  - "docs/**"
  - "examples/**"
  - "**/*.test.ts"
  - "**/test-helpers.ts"
  - "**/test-fixtures/**"

comment:
  layout: "diff, files"
  require_changes: true
